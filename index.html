<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equistar Tack Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #222222;
    }

    #controls {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }

    #filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    #search {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    select,
    input,
    button {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      background: #ffffff;
    }

    input {
      width: 220px;
    }

    button {
      cursor: pointer;
      background: #111111;
      color: #ffffff;
      border-color: #111111;
    }

    button:hover {
      background: #333333;
    }

    #gallery {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
    }

    .item {
      min-width: 0;
      text-align: center;
    }

    .images {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 4px;
    }

    .images.single {
      grid-template-columns: minmax(0, 1fr);
    }

    .images img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 6px;
    }

    .item-name {
      margin-top: 8px;
      font-weight: 600;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 850px) {
      #gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      #controls {
        flex-direction: column;
      }

      #search {
        width: 100%;
      }

      input {
        flex: 1;
        width: auto;
      }

      #gallery {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 400px) {
      #filters {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
      }

      #filters select {
        width: 100%;
      }

      #search {
        flex-direction: column;
      }

      #search input,
      #search button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div id="controls">
    <div id="filters">
      <select id="typeFilter">
        <option value="all">All Tack</option>
        <option value="blanket">Blankets</option>
        <option value="breast-collar">Breast Collars</option>
        <option value="bridle">Bridles</option>
        <option value="earbonnet">Earbonnets</option>
        <option value="flymask">Fly Masks</option>
        <option value="girth-strap">Girth Straps</option>
        <option value="halter">Halters</option>
        <option value="horse-armor">Horse Armors</option>
        <option value="leg-wrap">Leg Wraps</option>
        <option value="saddle-bag">Saddle Bags</option>
        <option value="saddle">Saddles</option>
        <option value="turnout-blanket">Turnout Blankets</option>
      </select>

      <select id="styleFilter" style="display: none;">
        <option value="all">All Styles</option>
      </select>

      <select id="modelFilter">
        <option value="all">All Models</option>
        <option value="light">Light</option>
        <option value="medium">Medium</option>
        <option value="dark">Dark</option>
      </select>

      <select id="modFilter">
        <option value="all">All Mods</option>
        <option value="tres">Tre's Tack</option>
        <option value="bageks">Bageks</option>
      </select>
    </div>

    <div id="search">
      <input
        type="text"
        id="searchInput"
        placeholder="Search tack..."
      >
      <button id="searchButton">Search</button>
    </div>
  </div>

  <div id="gallery"></div>

  <script src="tack-data.js"></script>

  <script>
    const typeFilter = document.getElementById("typeFilter");
    const styleFilter = document.getElementById("styleFilter");
    const modelFilter = document.getElementById("modelFilter");
    const modFilter = document.getElementById("modFilter");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const gallery = document.getElementById("gallery");

    let currentSearch = "";

    const stylesByType = {
      saddle: [
        { value: "adventure", label: "Adventure" },
        { value: "english", label: "English" },
        { value: "liberty-bareback", label: "Liberty/Bareback" },
        { value: "specialty", label: "Specialty" },
        { value: "western", label: "Western" }
      ],

      bridle: [
        { value: "adventure", label: "Adventure" },
        { value: "bitless", label: "Bitless" },
        { value: "cloth", label: "Cloth" },
        { value: "english", label: "English" },
        { value: "liberty-bareback", label: "Liberty/Bareback" },
        { value: "specialty", label: "Specialty" },
        { value: "western", label: "Western" }
      ],

      blanket: [
        { value: "adventure", label: "Adventure" },
        { value: "english", label: "English" },
        { value: "english-quarter-sheets", label: "English Quarter Sheets" },
        { value: "liberty-bareback", label: "Liberty/Bareback" },
        { value: "racing", label: "Racing" },
        { value: "western", label: "Western" }
      ],

      "leg-wrap": [
        { value: "adventure", label: "Adventure" },
        { value: "english", label: "English" },
        { value: "tendon-boots", label: "Tendon Boots" },
        { value: "travel-boots", label: "Travel Boots" },
        { value: "western", label: "Western" }
      ],

      "breast-collar": [
        { value: "adventure", label: "Adventure" },
        { value: "cloth", label: "Cloth" },
        { value: "english", label: "English" },
        { value: "western", label: "Western" },
        { value: "working-harnesses", label: "Working Harnesses" }
      ],

      "girth-strap": [
        { value: "adventure", label: "Adventure" },
        { value: "cloth", label: "Cloth" },
        { value: "english", label: "English" },
        { value: "liberty-bareback", label: "Liberty/Bareback" },
        { value: "western", label: "Western" }
      ],

      "turnout-blanket": [
        { value: "flysheets", label: "Flysheets" },
        { value: "pasture-blankets", label: "Pasture Blankets" },
        { value: "rainsheets", label: "Rainsheets" }
      ]
    };

    function resizeWebFrame() {
      if (window.parent === window) {
        return;
      }

      const height = document.documentElement.scrollHeight;

      window.parent.postMessage(
        {
          type: "@webframe.resize",
          height: height
        },
        "*"
      );
    }

    function updateStyleFilter() {
      const selectedType = typeFilter.value;
      const styles = stylesByType[selectedType] || [];

      styleFilter.innerHTML = "";

      const allOption = document.createElement("option");
      allOption.value = "all";
      allOption.textContent = "All Styles";
      styleFilter.appendChild(allOption);

      if (styles.length === 0) {
        styleFilter.value = "all";
        styleFilter.style.display = "none";
        return;
      }

      styles.forEach(style => {
        const option = document.createElement("option");
        option.value = style.value;
        option.textContent = style.label;
        styleFilter.appendChild(option);
      });

      styleFilter.value = "all";
      styleFilter.style.display = "";
    }

    function renderGallery() {
      const selectedType = typeFilter.value;
      const selectedStyle = styleFilter.value;
      const selectedModel = modelFilter.value;
      const selectedMod = modFilter.value;

      const filteredItems = tackItems.filter(item => {
        const matchesType =
          selectedType === "all" ||
          item.type === selectedType;

        const matchesStyle =
          selectedStyle === "all" ||
          item.style === selectedStyle;

        const matchesModel =
          selectedModel === "all" ||
          (
            item.images &&
            item.images[selectedModel]
          );

        const matchesMod =
          selectedMod === "all" ||
          item.mod === selectedMod;

        const searchText = currentSearch.toLowerCase();

        const matchesSearch =
          !searchText ||
          item.name.toLowerCase().includes(searchText) ||
          (item.type || "").toLowerCase().includes(searchText) ||
          (item.style || "").toLowerCase().includes(searchText) ||
          (item.mod || "").toLowerCase().includes(searchText);

        return (
          matchesType &&
          matchesStyle &&
          matchesModel &&
          matchesMod &&
          matchesSearch
        );
      });

      gallery.innerHTML = "";

      if (filteredItems.length === 0) {
        const noResults = document.createElement("div");
        noResults.className = "no-results";
        noResults.textContent = "No tack found.";
        gallery.appendChild(noResults);
        resizeWebFrame();
        return;
      }

      filteredItems.forEach(item => {
        const itemElement = document.createElement("div");
        itemElement.className = "item";

        const imagesElement = document.createElement("div");
        imagesElement.className = "images";

        if (selectedModel !== "all") {
          imagesElement.classList.add("single");

          const image = document.createElement("img");
          image.src = item.images[selectedModel];
          image.alt = `${item.name} - ${selectedModel} model`;

          imagesElement.appendChild(image);
        } else {
          ["light", "medium", "dark"].forEach(model => {
            const image = document.createElement("img");
            image.src = item.images[model];
            image.alt = `${item.name} - ${model} model`;

            imagesElement.appendChild(image);
          });
        }

        const nameElement = document.createElement("div");
        nameElement.className = "item-name";
        nameElement.textContent = item.name;

        itemElement.appendChild(imagesElement);
        itemElement.appendChild(nameElement);
        gallery.appendChild(itemElement);
      });

      resizeWebFrame();
    }

    typeFilter.addEventListener("change", () => {
      updateStyleFilter();
      renderGallery();
    });

    styleFilter.addEventListener("change", () => {
      renderGallery();
    });

    modelFilter.addEventListener("change", () => {
      renderGallery();
    });

    modFilter.addEventListener("change", () => {
      renderGallery();
    });

    searchButton.addEventListener("click", () => {
      currentSearch = searchInput.value.trim();
      renderGallery();
    });

    window.addEventListener("resize", resizeWebFrame);

    const resizeObserver = new ResizeObserver(() => {
      resizeWebFrame();
    });

    resizeObserver.observe(document.body);

    updateStyleFilter();
    renderGallery();
    resizeWebFrame();
  </script>

</body>
</html>
