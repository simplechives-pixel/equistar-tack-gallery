<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Equistar Tack Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #1f1f1f;
      background: transparent;
    }

    #controls {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    #filters {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    #searchArea {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    select,
    input {
      height: 36px;
      padding: 0 10px;
      border: 1px solid #d6d6d6;
      border-radius: 6px;
      background: white;
      color: #1f1f1f;
      font-family: inherit;
      font-size: 14px;
    }

    select {
      min-width: 125px;
    }

    input {
      width: 190px;
    }

    button {
      height: 36px;
      padding: 0 14px;
      border: none;
      border-radius: 6px;
      background: #1f1f1f;
      color: white;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }

    #gallery {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px 20px;
    }

    .item {
      width: 100%;
      min-width: 0;
    }

    .images {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 5px;
    }

    .images.single {
      grid-template-columns: minmax(0, 1fr);
    }

    .images img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      border-radius: 6px;
    }

    .name {
      width: 100%;
      margin-top: 8px;
      text-align: center;
      font-size: 14px;
      line-height: 1.3;
      font-weight: 600;
    }

    #noResults {
      display: none;
      width: 100%;
      padding: 40px 20px;
      text-align: center;
      color: #777;
      font-size: 15px;
    }

    @media (max-width: 850px) {
      #controls {
        flex-wrap: wrap;
      }

      #filters {
        flex-wrap: wrap;
      }

      #searchArea {
        margin-left: auto;
      }

      #gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      #controls {
        flex-direction: column;
        align-items: stretch;
      }

      #filters {
        width: 100%;
        flex-wrap: wrap;
      }

      #filters select {
        flex: 1;
        min-width: 0;
      }

      #searchArea {
        width: 100%;
        margin-left: 0;
      }

      #searchArea input {
        flex: 1;
        width: auto;
      }

      #gallery {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    @media (max-width: 400px) {
      #filters {
        flex-direction: column;
        align-items: stretch;
      }

      #filters select {
        width: 100%;
      }

      #searchArea {
        flex-wrap: wrap;
      }

      #searchArea input {
        width: 100%;
        flex: none;
      }

      #searchArea button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div id="controls">

    <div id="filters">

      <select id="typeFilter">
        <option value="all">All Tack</option>
        <option value="blanket">Blankets</option>
        <option value="breast-collar">Breast Collars</option>
        <option value="bridle">Bridles</option>
        <option value="earbonnet">Earbonnets</option>
        <option value="flymask">Flymasks</option>
        <option value="girth-strap">Girth Straps</option>
        <option value="halter">Halters</option>
        <option value="horse-armor">Horse Armor</option>
        <option value="leg-wrap">Leg Wraps</option>
        <option value="saddle-bag">Saddle Bags</option>
        <option value="saddle">Saddles</option>
        <option value="turnout-blanket">Turnout Blankets</option>
      </select>

      <select id="styleFilter" style="display: none;">
        <option value="all">All Styles</option>
      </select>

      <select id="modelFilter">
        <option value="all">All Models</option>
        <option value="light">Light</option>
        <option value="medium">Medium</option>
        <option value="dark">Dark</option>
      </select>

      <select id="modFilter">
        <option value="all">All Mods</option>
        <option value="tres">Tre's Tack</option>
        <option value="bageks">Bageks</option>
      </select>

    </div>

    <div id="searchArea">

      <input
        id="searchInput"
        type="text"
        placeholder="Search tack..."
      >

      <button id="searchButton">
        Search
      </button>

    </div>

  </div>

  <div id="gallery"></div>

  <div id="noResults">
    No tack matches your search.
  </div>

  <script src="tack-data.js"></script>

  <script>

    let currentSearch = "";

    const stylesByType = {
      saddle: [
        {
          value: "adventure",
          label: "Adventure"
        },
        {
          value: "english",
          label: "English"
        },
        {
          value: "liberty-bareback",
          label: "Liberty/Bareback"
        },
        {
          value: "specialty",
          label: "Specialty"
        },
        {
          value: "western",
          label: "Western"
        }
      ],

      blanket: [
        {
          value: "adventure",
          label: "Adventure"
        },
        {
          value: "english",
          label: "English"
        },
        {
          value: "english-quarter-sheets",
          label: "English Quarter Sheets"
        },
        {
          value: "liberty-bareback",
          label: "Liberty/Bareback"
        },
        {
          value: "racing",
          label: "Racing"
        },
        {
          value: "western",
          label: "Western"
        }
      ]
    };

    function updateStyleFilter() {
      const type =
        document
          .getElementById("typeFilter")
          .value;

      const styleFilter =
        document.getElementById("styleFilter");

      const styles =
        stylesByType[type];

      if (!styles) {
        styleFilter.style.display = "none";
        styleFilter.innerHTML =
          '<option value="all">All Styles</option>';
        styleFilter.value = "all";
        return;
      }

      styleFilter.style.display = "";

      styleFilter.innerHTML =
        '<option value="all">All Styles</option>' +
        styles
          .map(style => `
            <option value="${style.value}">
              ${style.label}
            </option>
          `)
          .join("");

      styleFilter.value = "all";
    }

    function resizeWebFrame() {
      const width =
        document.documentElement.scrollWidth;

      const height =
        document.documentElement.scrollHeight;

      if (
        width <= 0 ||
        height <= 0
      ) {
        return;
      }

      const aspectRatio =
        width / height;

      window.parent.postMessage(
        {
          action: {
            action: "@webframe.resize",
            aspectRatio: aspectRatio,
            maxHeight: Math.max(height, 200)
          }
        },
        "*"
      );
    }

    function renderGallery() {
      const gallery =
        document.getElementById("gallery");

      const noResults =
        document.getElementById("noResults");

      const type =
        document
          .getElementById("typeFilter")
          .value;

      const style =
        document
          .getElementById("styleFilter")
          .value;

      const model =
        document
          .getElementById("modelFilter")
          .value;

      const mod =
        document
          .getElementById("modFilter")
          .value;

      const filteredItems =
        tackItems.filter(item => {

          if (
            type !== "all" &&
            item.type !== type
          ) {
            return false;
          }

          if (
            style !== "all" &&
            item.style !== style
          ) {
            return false;
          }

          if (
            mod !== "all" &&
            item.mod !== mod
          ) {
            return false;
          }

          if (
            currentSearch !== ""
          ) {
            const searchableText =
              (
                item.name +
                " " +
                item.type +
                " " +
                (item.style || "") +
                " " +
                item.mod
              ).toLowerCase();

            if (
              !searchableText.includes(
                currentSearch
              )
            ) {
              return false;
            }
          }

          return true;
        });

      if (
        filteredItems.length === 0
      ) {
        gallery.innerHTML = "";
        noResults.style.display = "block";
        resizeWebFrame();
        return;
      }

      noResults.style.display = "none";

      gallery.innerHTML =
        filteredItems
          .map(item => {

            if (
              model === "all"
            ) {
              return `
                <div class="item">
                  <div class="images">
                    <img
                      src="${item.images.light}"
                      alt="${item.name} - Light"
                    >
                    <img
                      src="${item.images.medium}"
                      alt="${item.name} - Medium"
                    >
                    <img
                      src="${item.images.dark}"
                      alt="${item.name} - Dark"
                    >
                  </div>

                  <div class="name">
                    ${item.name}
                  </div>
                </div>
              `;
            }

            return `
              <div class="item">
                <div class="images single">
                  <img
                    src="${item.images[model]}"
                    alt="${item.name} - ${model}"
                  >
                </div>

                <div class="name">
                  ${item.name}
                </div>
              </div>
            `;
          })
          .join("");

      requestAnimationFrame(
        resizeWebFrame
      );
    }

    document
      .getElementById("typeFilter")
      .addEventListener(
        "change",
        () => {
          updateStyleFilter();
          renderGallery();
        }
      );

    document
      .getElementById("styleFilter")
      .addEventListener(
        "change",
        renderGallery
      );

    document
      .getElementById("modelFilter")
      .addEventListener(
        "change",
        renderGallery
      );

    document
      .getElementById("modFilter")
      .addEventListener(
        "change",
        renderGallery
      );

    document
      .getElementById("searchButton")
      .addEventListener(
        "click",
        () => {

          currentSearch =
            document
              .getElementById("searchInput")
              .value
              .trim()
              .toLowerCase();

          renderGallery();
        }
      );

    document
      .getElementById("searchInput")
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter"
          ) {
            document
              .getElementById("searchButton")
              .click();
          }

        }
      );

    const resizeObserver =
      new ResizeObserver(
        () => {
          resizeWebFrame();
        }
      );

    resizeObserver.observe(
      document.body
    );

    updateStyleFilter();

    renderGallery();

    window.parent.postMessage(
      {
        action: {
          action: "@webframe.ready"
        }
      },
      "*"
    );

  </script>

</body>

</html>
