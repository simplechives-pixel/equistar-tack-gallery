<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Equistar Tack Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #1f1f1f;
    }

    #gallery {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 16px;
    }

    .item {
      width: 100%;
      min-width: 0;
    }

    .images {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 4px;
    }

    .images.single {
      grid-template-columns:
        minmax(0, 1fr);
    }

    .images img {
      display: block;

      width: 100%;

      aspect-ratio: 4 / 3;

      object-fit: cover;

      border-radius: 6px;
    }

    .name {
      width: 100%;

      margin-top: 8px;

      text-align: center;

      font-size: 14px;

      line-height: 1.3;

      font-weight: 600;
    }

    .empty {
      grid-column: 1 / -1;

      text-align: center;

      padding: 30px 10px;

      opacity: 0.65;
    }

    @media (max-width: 700px) {
      #gallery {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 450px) {
      #gallery {
        grid-template-columns:
          minmax(0, 1fr);
      }
    }
  </style>
</head>

<body>

  <div id="gallery"></div>

  <script>
    const gallery = document.getElementById("gallery");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function render(data) {
      const items = data?.items ?? [];
      const model = data?.model ?? "all";

      if (items.length === 0) {
        gallery.innerHTML =
          '<div class="empty">No tack matches your filters.</div>';

        resize();

        return;
      }

      gallery.innerHTML = items
        .map((item) => {

          const name = escapeHtml(item.name);

          if (model === "all") {
            return `
              <div class="item">

                <div class="images">

                  <img
                    src="${item.images.light}"
                    alt="${name} - Light"
                  >

                  <img
                    src="${item.images.medium}"
                    alt="${name} - Medium"
                  >

                  <img
                    src="${item.images.dark}"
                    alt="${name} - Dark"
                  >

                </div>

                <div class="name">
                  ${name}
                </div>

              </div>
            `;
          }

          return `
            <div class="item">

              <div class="images single">

                <img
                  src="${item.images[model]}"
                  alt="${name}"
                >

              </div>

              <div class="name">
                ${name}
              </div>

            </div>
          `;
        })
        .join("");

      resize();
    }

    function resize() {
      window.parent.postMessage(
        {
          action: {
            action: "@webframe.resize",
            maxHeight: 1200
          }
        },
        "*"
      );
    }

    window.addEventListener("message", (event) => {

      const state = event.data?.state;

      if (!state) {
        return;
      }

      let items = [];

      if (typeof state.items === "string") {
        try {
          items = JSON.parse(state.items);
        } catch {
          items = [];
        }
      }

      render({
        items: items,
        model: state.model ?? "all"
      });
    });

    window.parent.postMessage(
      {
        action: {
          action: "@webframe.ready"
        }
      },
      "*"
    );
  </script>

</body>
</html>
