<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Equistar Tack Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #1f1f1f;
    }

    #gallery {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 16px;
    }

    .item {
      width: 100%;
      min-width: 0;
    }

    .images {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 4px;
    }

    .images img {
      display: block;

      width: 100%;

      aspect-ratio: 4 / 3;

      object-fit: cover;

      border-radius: 6px;
    }

    .name {
      width: 100%;

      margin-top: 8px;

      text-align: center;

      font-size: 14px;

      line-height: 1.3;

      font-weight: 600;
    }
  </style>
</head>

<body>

  <div id="gallery"></div>

  <script>
    const imageUrl =
      "https://file.garden/aNzd9GYmaWI-Oky9/360_F_65473506_rjydmo8sf1stj5KiJhukACvwVHNWxQAf.jpg";

    const items = [
      {
        name: "Lavender Bridle",
        images: {
          light: imageUrl,
          medium: imageUrl,
          dark: imageUrl
        }
      },
      {
        name: "Rose Saddle",
        images: {
          light: imageUrl,
          medium: imageUrl,
          dark: imageUrl
        }
      },
      {
        name: "Black Blanket",
        images: {
          light: imageUrl,
          medium: imageUrl,
          dark: imageUrl
        }
      }
    ];

    document.getElementById("gallery").innerHTML = items
      .map(item => `
        <div class="item">

          <div class="images">

            <img
              src="${item.images.light}"
              alt="${item.name} - Light"
            >

            <img
              src="${item.images.medium}"
              alt="${item.name} - Medium"
            >

            <img
              src="${item.images.dark}"
              alt="${item.name} - Dark"
            >

          </div>

          <div class="name">
            ${item.name}
          </div>

        </div>
      `)
      .join("");

    window.parent.postMessage(
      {
        action: {
          action: "@webframe.ready"
        }
      },
      "*"
    );

    window.parent.postMessage(
      {
        action: {
          action: "@webframe.resize",
          maxHeight: 1200
        }
      },
      "*"
    );
  </script>

</body>
</html>
