<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Equistar Tack Gallery</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      color: #1f1f1f;
      background: transparent;
    }

    /* =========================
       CONTROLS
       ========================= */

    #controls {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;

      margin-bottom: 20px;
    }

    #filters {
      display: flex;
      align-items: center;

      gap: 8px;
    }

    #searchArea {
      display: flex;
      align-items: center;

      gap: 8px;
    }

    select,
    input {
      height: 36px;

      padding: 0 10px;

      border: 1px solid #d6d6d6;
      border-radius: 6px;

      background: white;

      color: #1f1f1f;

      font-family: inherit;
      font-size: 14px;
    }

    select {
      min-width: 125px;
    }

    input {
      width: 190px;
    }

    button {
      height: 36px;

      padding: 0 14px;

      border: none;
      border-radius: 6px;

      background: #1f1f1f;
      color: white;

      font-family: inherit;
      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    button:hover {
      opacity: 0.85;
    }


    /* =========================
       GALLERY
       ========================= */

    #gallery {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 20px;
    }


    /* =========================
       TACK ITEM
       ========================= */

    .item {
      width: 100%;
      min-width: 0;
    }


    /* =========================
       MODEL IMAGES
       ========================= */

    .images {
      width: 100%;

      display: grid;

      grid-template-columns:
        repeat(3, minmax(0, 1fr));

      gap: 5px;
    }

    .images.single {
      grid-template-columns:
        minmax(0, 1fr);
    }

    .images img {
      display: block;

      width: 100%;

      aspect-ratio: 4 / 3;

      object-fit: cover;

      border-radius: 6px;
    }


    /* =========================
       TACK NAME
       ========================= */

    .name {
      width: 100%;

      margin-top: 8px;

      text-align: center;

      font-size: 14px;
      line-height: 1.3;

      font-weight: 600;
    }


    /* =========================
       NO RESULTS
       ========================= */

    #noResults {
      display: none;

      width: 100%;

      padding: 40px 20px;

      text-align: center;

      color: #777;

      font-size: 15px;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      #controls {
        flex-direction: column;
        align-items: stretch;
      }

      #filters {
        flex-wrap: wrap;
      }

      #searchArea {
        width: 100%;
      }

      #searchArea input {
        flex: 1;
        width: auto;
      }

      #gallery {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 450px) {

      #gallery {
        grid-template-columns:
          minmax(0, 1fr);
      }
    }

  </style>
</head>


<body>


  <!-- =========================
       FILTERS + SEARCH
       ========================= -->

  <div id="controls">

    <div id="filters">

      <select id="typeFilter">
        <option value="all">All Tack</option>
        <option value="bridle">Bridles</option>
        <option value="saddle">Saddles</option>
        <option value="blanket">Blankets</option>
      </select>


      <select id="modelFilter">
        <option value="all">All Models</option>
        <option value="light">Light</option>
        <option value="medium">Medium</option>
        <option value="dark">Dark</option>
      </select>


      <select id="modFilter">
        <option value="all">All Mods</option>
        <option value="tres">Tre's Tack</option>
        <option value="bageks">Bageks</option>
      </select>

    </div>


    <div id="searchArea">

      <input
        id="searchInput"
        type="text"
        placeholder="Search tack..."
      >

      <button id="searchButton">
        Search
      </button>

    </div>

  </div>


  <!-- =========================
       GALLERY
       ========================= -->

  <div id="gallery"></div>

  <div id="noResults">
    No tack matches your search.
  </div>


  <script>

    /*
     * Temporary image used for all three test items.
     *
     * We'll replace these URLs with your actual
     * horse-model screenshots later.
     */

    const imageUrl =
      "https://file.garden/aNzd9GYmaWI-Oky9/360_F_65473506_rjydmo8sf1stj5KiJhukACvwVHNWxQAf.jpg";


    /*
     * =========================
     * TACK DATA
     * =========================
     *
     * Each tack item exists only ONCE.
     *
     * It contains three images:
     *
     * light
     * medium
     * dark
     *
     * This is important because we don't want
     * three separate gallery entries for one item.
     */

    const tackItems = [

      {
        name: "Lavender Bridle",

        type: "bridle",

        mod: "tres",

        images: {
          light: imageUrl,
          medium: imageUrl,
          dark: imageUrl
        }
      },


      {
        name: "Rose Saddle",

        type: "saddle",

        mod: "bageks",

        images: {
          light: imageUrl,
          medium: imageUrl,
          dark: imageUrl
        }
      },


      {
        name: "Black Blanket",

        type: "blanket",

        mod: "tres",

        images: {
          light: imageUrl,
          medium: imageUrl,
          dark: imageUrl
        }
      }

    ];


    /*
     * =========================
     * CURRENT FILTER STATE
     * =========================
     */

    let currentSearch = "";


    /*
     * =========================
     * RENDER GALLERY
     * =========================
     */

    function renderGallery() {

      const gallery =
        document.getElementById("gallery");

      const noResults =
        document.getElementById("noResults");


      const type =
        document.getElementById("typeFilter").value;


      const model =
        document.getElementById("modelFilter").value;


      /*
       * Filter the tack list.
       */

      const filteredItems =
        tackItems.filter(item => {

          /*
           * Tack type filter
           */

          if (
            type !== "all" &&
            item.type !== type
          ) {
            return false;
          }


          /*
           * Mod filter
           */

          const mod =
            document.getElementById("modFilter").value;

          if (
            mod !== "all" &&
            item.mod !== mod
          ) {
            return false;
          }


          /*
           * Search
           *
           * Search name, type and mod.
           */

          if (currentSearch !== "") {

            const searchableText =
              (
                item.name +
                " " +
                item.type +
                " " +
                item.mod
              ).toLowerCase();


            if (
              !searchableText.includes(
                currentSearch
              )
            ) {
              return false;
            }
          }


          return true;

        });


      /*
       * Nothing matched.
       */

      if (filteredItems.length === 0) {

        gallery.innerHTML = "";

        noResults.style.display = "block";

        return;
      }


      noResults.style.display = "none";


      /*
       * Build the gallery.
       */

      gallery.innerHTML =
        filteredItems.map(item => {


          /*
           * ALL MODELS
           *
           * Show all three images.
           */

          if (model === "all") {

            return `
              <div class="item">

                <div class="images">

                  <img
                    src="${item.images.light}"
                    alt="${item.name} - Light"
                  >

                  <img
                    src="${item.images.medium}"
                    alt="${item.name} - Medium"
                  >

                  <img
                    src="${item.images.dark}"
                    alt="${item.name} - Dark"
                  >

                </div>

                <div class="name">
                  ${item.name}
                </div>

              </div>
            `;
          }


          /*
           * SPECIFIC MODEL
           *
           * Show only one image.
           */

          return `
            <div class="item">

              <div class="images single">

                <img
                  src="${item.images[model]}"
                  alt="${item.name} - ${model}"
                >

              </div>

              <div class="name">
                ${item.name}
              </div>

            </div>
          `;

        }).join("");

    }


    /*
     * =========================
     * FILTER EVENTS
     * =========================
     */

    document
      .getElementById("typeFilter")
      .addEventListener(
        "change",
        renderGallery
      );


    document
      .getElementById("modelFilter")
      .addEventListener(
        "change",
        renderGallery
      );


    document
      .getElementById("modFilter")
      .addEventListener(
        "change",
        renderGallery
      );


    /*
     * =========================
     * SEARCH BUTTON
     * =========================
     */

    document
      .getElementById("searchButton")
      .addEventListener(
        "click",
        () => {

          currentSearch =
            document
              .getElementById("searchInput")
              .value
              .trim()
              .toLowerCase();

          renderGallery();

        }
      );


    /*
     * =========================
     * ENTER KEY SEARCH
     * =========================
     */

    document
      .getElementById("searchInput")
      .addEventListener(
        "keydown",
        event => {

          if (event.key === "Enter") {

            document
              .getElementById("searchButton")
              .click();

          }

        }
      );


    /*
     * =========================
     * INITIAL RENDER
     * =========================
     */

    renderGallery();


    /*
     * =========================
     * GITBOOK WEBFRAME
     * =========================
     */

    window.parent.postMessage(
      {
        action: {
          action: "@webframe.ready"
        }
      },
      "*"
    );


    window.parent.postMessage(
      {
        action: {
          action: "@webframe.resize",

          aspectRatio: 1.5,

          maxHeight: 1200
        }
      },
      "*"
    );

  </script>

</body>

</html>
